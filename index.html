<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Task Master</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Premium Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Fallback font */
        body {
            font-family: 'Outfit', 'Segoe UI', sans-serif;
        }

        /* SVG Icon Utilities */
        .icon {
            width: 1.2em;
            height: 1.2em;
            vertical-align: text-bottom;
            fill: currentColor;
        }

        .icon-lg {
            width: 1.5em;
            height: 1.5em;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass-panel">
            <div class="logo">
                <svg class="icon icon-lg" viewBox="0 0 24 24">
                    <path
                        d="M17 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4V1h2v2h6V1h2v2zm-2 2H9v2H7V5H4v4h16V5h-3v2h-2V5zm5 6H4v10h16V11z" />
                </svg>
                <span>TaskFlow</span>
            </div>
            <div class="view-switcher">
                <button class="btn active" id="btn-view-calendar" onclick="switchView('calendar')">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M19 4h-2V2h-2v2H9V2H7v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5v-5z" />
                    </svg>
                    日历视图
                </button>
                <button class="btn" id="btn-view-task" onclick="switchView('task')">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7v-7zm4 0h2v7h-2v-7zm4 0h2v7h-2v-7z" />
                    </svg>
                    任务视图
                </button>
            </div>
            <div class="actions">
                <button class="btn icon-btn" onclick="newFile()" title="新建保存文件 (另存为)">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
                    </svg>
                </button>
                <button class="btn icon-btn" onclick="connectFile()" title="打开/连接已有文件">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" />
                    </svg>
                </button>
                <button class="btn icon-btn" onclick="openSettings()" title="设置">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L6.68 8.87c-.11.2-.06.47.12.61l2.03 1.58c-.05.3-.09.63-.09.95s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.11-.22.06-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal-overlay hidden">
            <div class="modal glass-panel">
                <header class="modal-header">
                    <h3>全局设置</h3>
                    <button class="btn icon-btn close-btn" onclick="closeSettings()">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path
                                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                        </svg>
                    </button>
                </header>
                <div class="modal-body">
                    <div class="section-title">界面主题 (Color Theme)</div>
                    <div class="theme-grid">
                        <div class="theme-option" onclick="applyTheme('default')" id="theme-opt-default">
                            <div class="theme-preview"
                                style="--preview-color: #6366f1; --preview-glow: rgba(99, 102, 241, 0.8);"></div>
                            <span>默认深蓝</span>
                        </div>
                        <div class="theme-option" onclick="applyTheme('warm')" id="theme-opt-warm">
                            <div class="theme-preview"
                                style="--preview-color: #f59e0b; --preview-glow: rgba(245, 158, 11, 0.8);"></div>
                            <span>暖黄琥珀</span>
                        </div>
                        <div class="theme-option" onclick="applyTheme('pink')" id="theme-opt-pink">
                            <div class="theme-preview"
                                style="--preview-color: #ec4899; --preview-glow: rgba(236, 72, 153, 0.8);"></div>
                            <span>亮粉霓虹</span>
                        </div>
                        <div class="theme-option" onclick="applyTheme('fresh')" id="theme-opt-fresh">
                            <div class="theme-preview"
                                style="--preview-color: #0ea5e9; --preview-glow: rgba(14, 165, 233, 0.8);"></div>
                            <span>清爽海洋</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <main>
            <!-- Calendar View -->
            <section id="view-calendar" class="view-section active">
                <div class="calendar-header">
                    <button class="btn icon-btn" onclick="changeMonth(-1)">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                        </svg> 上一月
                    </button>
                    <h2 id="calendar-month-title">2026年 1月</h2>
                    <button class="btn icon-btn" onclick="changeMonth(1)">
                        下一月 <svg class="icon" viewBox="0 0 24 24">
                            <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
                        </svg>
                    </button>
                </div>
                <div class="calendar-grid-header">
                    <div>周日</div>
                    <div>周一</div>
                    <div>周二</div>
                    <div>周三</div>
                    <div>周四</div>
                    <div>周五</div>
                    <div>周六</div>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Days will be injected here -->
                </div>
            </section>

            <!-- Task View -->
            <section id="view-task" class="view-section" style="display: none;">
                <div class="task-toolbar glass-panel">
                    <button class="btn primary" onclick="addNewL1Task()">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                        </svg> 新建一级任务
                    </button>
                </div>
                <div class="task-list" id="task-list-container">
                    <!-- Task Tree injected here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Day Modal -->
    <div id="day-modal" class="modal-overlay hidden">
        <div class="modal glass-panel">
            <header class="modal-header">
                <h3 id="modal-date-title">1月6日 周二</h3>
                <button class="btn icon-btn close-btn" onclick="closeModal()">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                    </svg>
                </button>
            </header>
            <div class="modal-body">
                <div class="section-title">今日任务 (三级)</div>
                <div id="modal-task-list" class="modal-task-list">
                    <!-- Scheduled tasks go here -->
                </div>

                <div class="section-divider"></div>

                <div class="section-title">添加任务到今日</div>
                <div class="add-task-row">
                    <select id="modal-task-select" class="glass-input">
                        <option value="">选择一个未排期的三级任务...</option>
                    </select>
                    <button class="btn primary" onclick="scheduleTasktToDate()">添加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Date Range Modal -->
    <div id="date-modal" class="modal-overlay hidden">
        <div class="modal glass-panel">
            <header class="modal-header">
                <h3>设置任务时间</h3>
                <button class="btn icon-btn close-btn" onclick="closeDateModal()">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                    </svg>
                </button>
            </header>
            <div class="modal-body">
                <input type="hidden" id="date-modal-task-id">
                <div style="margin-bottom: 1rem;">
                    <label
                        style="display:block; color:var(--text-secondary); margin-bottom:0.5rem; font-size:0.9rem;">开始日期</label>
                    <input type="date" id="date-modal-start" class="glass-input" style="width:100%"
                        onclick="try{this.showPicker()}catch(e){}">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label
                        style="display:block; color:var(--text-secondary); margin-bottom:0.5rem; font-size:0.9rem;">结束日期</label>
                    <input type="date" id="date-modal-end" class="glass-input" style="width:100%"
                        onclick="try{this.showPicker()}catch(e){}">
                </div>
                <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
                    <button class="btn" onclick="closeDateModal()">取消</button>
                    <button class="btn primary" onclick="saveDateRange()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
